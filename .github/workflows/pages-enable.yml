name: Optional GitHub Pages demo

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ hashFiles('demo/**') != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload optional static demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./demo
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
