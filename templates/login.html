<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library Login</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="container"><section class="card"><p class="eyebrow">Protected demo</p><h1>Library sign in</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<p class="flash flash-{{ category }}">{{ message }}</p>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" required></label><label>Password<input name="password" type="password" required></label><button type="submit">Sign in</button></form><p><small>Demo accounts: admin / admin-demo · aarav / student-demo. Change passwords via environment variables outside local demos.</small></p></section></main></body></html>
